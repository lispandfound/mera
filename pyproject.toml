[project]
name = "mera"
version = "0.1.0"
description = "Mixed-effects decomposition of ground-motion residuals"
readme = "README.md"
authors = [
    { name = "Jake Faulkner", email = "jakefaulkn@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[project.optional-dependencies]
test = ["hypothesis>=6.168.5", "pytest>=9.1.1", "pytest-cov>=5"]

[dependency-groups]
dev = ["deptry", "ruff", "ty"]

[tool.deptry]
optional_dependencies_dev_groups = ["test"]
# The src/ layout hides the package from deptry's first-party detection.
known_first_party = ["mera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: large-scale tests (high memory/runtime); run with -m slow"]

[tool.ruff.lint]
extend-select = [
  # isort imports
  "I",
  # Use r'\s+' rather than '\s+'
  "W605",
  # All the naming errors, like using camel case for function names.
  "N",
  # Missing docstrings in classes, methods, and functions
  "D101",
  "D102",
  "D103",
  "D105",
  "D107",
  # Use f-string instead of a format call
  "UP032",
  # Standard library import is deprecated
  "UP035",
  # Missing function argument type-annotation
  "ANN001",
  # Using except without specifying an exception type to catch
  "BLE001",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = [
  "mera",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"tests/**.py" = ["D", "ANN001", "N806"]
# Linear-algebra names follow the maths: A, B, W, N, K, ...
"src/mera/core.py" = ["N806"]

[tool.npdlint]
include = ["src/mera"]
select = ["ALL"]
ignore = ["ES01", "SA01", "EX01"]

[tool.npdlint.per-file-ignores]
"**/__init__.py" = ["GL08"]

# Properties read as attributes, so document them as "type: summary".
[[tool.npdlint.scope]]
match = { kind = "property" }
extend-ignore = ["PR", "RT", "ES01"]
extend-select = ["PT"]
property-form = "type-line"

# Dunder methods only need to exist.
[[tool.npdlint.scope]]
match = { kind = "any-method", dunder = true }
select = ["GL08"]

# Last, so no block above re-selects a rule for them: private helpers, private
# properties included, are not part of the public API and need no docstring.
[[tool.npdlint.scope]]
match = { private = true }
skip = true

# Closures are their enclosing function's implementation, as private as a helper.
[[tool.npdlint.scope]]
match = { nested = true }
skip = true
